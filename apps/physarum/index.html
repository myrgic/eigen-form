<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physarum Stigmergy Simulation</title>
<script type="application/cogdoc+yaml">
id: paper-physarum-stigmergy
type: paper
title: "Physarum Stigmergy: sufficiency of a decaying shared trace for global coordination"
description: >
  8000 agents deposit into a diffusing, decaying pixel field and steer by three
  samples each; global structure emerges with no direct communication. Executable
  paper — parameters are sliders, and the deposit clamp is a reachable saturation
  bound that flattens the gradient and stops coordination.
sector: reference
status: draft
created: 2026-08-11
updated: 2026-08-18
salience: high
authors:
  - chazmaniandinkle
tags: [stigmergy, physarum, agent-coordination, decay, diffusion, eigen-form, executable-paper]
claim: >
  Deposit into a diffusing, decaying shared medium is sufficient for global
  structure to emerge among agents that never communicate directly, hold no
  model of each other, and read only three samples of the field per step.
method:
  - param: sa
    label: sensor angle
    range: [10, 90]
    default: 45
    unit: degrees
    meaning: angular offset of the left/right samples from heading
  - param: ra
    label: rotation angle
    range: [10, 90]
    default: 45
    unit: degrees
    meaning: turn applied per step when a flank sample wins
  - param: decay
    label: evaporation rate
    range: [0.8, 0.999]
    default: 0.99
    meaning: >
      per-frame multiplier on the field; trail half-life is
      log(0.5)/log(decay) frames. This is the damping term.
  - param: sensorDist
    default: 9
    fixed: true
    meaning: lookahead distance, 9x the step size
observables:
  agents: 8000
  field: Float32Array(width*height), 3x3 box blur then multiply by decay
  read_cost: 3 samples per agent per frame, O(1) in field size
findings:
  - >
    The passive read is O(1) in field size: each agent samples three cells
    regardless of grid dimensions, which is what makes a wide field affordable.
  - >
    Motor logic is hysteresis. The incumbent heading is retained unless a flank
    sample is strictly greater, so ties go to the incumbent — a displacement
    ratio of exactly 1.0.
  - >
    SATURATION IS REACHABLE AND DESTROYS COORDINATION. Equilibrium requires
    H(1-decay) = N*deposit; at decay=0.99, N=8000, deposit=25 the field wants
    ~20M units against a 255/cell clamp. Where cells pin at the clamp,
    wF == wL == wR, every branch of the motor logic is false, and the field
    stops steering. A field at its cap is flat, and a flat field carries no
    gradient. Consequence for any budgeted attention layer: the budget needs a
    lower bound (stay below saturation), not only an upper one.
limitations:
  - >
    No robust normalization: render and sensing both read raw cell values
    against a hard clamp. See app:welded_fields, which normalizes to the 99.5th
    percentile and fixes mask coverage rather than level.
  - The displacement ratio is implicit at 1.0 and not exposed as a parameter.
refs:
  - uri: app:welded_fields
    rel: corrected-by
    desc: >
      Reallocates the image buffer inside reset (comment "unlike the original")
      and floors dimensions with Math.max(64, ...); also supplies the metrology
      this artifact lacks.
  - uri: cog://rfc/058
    rel: demonstrates
    desc: >
      Declared observables' generation field as a decaying deposit medium;
      d(generation)/dt is the concentration map this simulation renders.
  - uri: cog://rfc/033
    rel: demonstrates
    desc: StigmergicProjector — coordination via trace, no messaging primitives.
  - uri: cog://mem/working/2026-08-18-physarum-as-attention-rig
    rel: grounds
    desc: Line-by-line correspondence to the attention layer derived 2026-08-18.
</script>

    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; height: 100vh; }
        #sidebar { width: 300px; background: #111; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; z-index: 10; border-right: 1px solid #333; }
        #canvas-container { flex: 1; position: relative; }
        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #6ee7b7; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; color: #ccc; display: flex; justify-content: space-between; }
        input[type=range] { width: 100%; }
        p.desc { font-size: 12px; color: #888; line-height: 1.4; margin: 0; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Slime Mold Stigmergy</h2>
    <p class="desc">Particles leave trails in a pixel grid. They sample the grid in front of them and steer toward the highest concentration. The grid continuously diffuses and decays.</p>
    
    <div class="control-group">
        <label>Sensor Angle (SA) <span id="val-sa">45°</span></label>
        <input type="range" id="ctrl-sa" min="10" max="90" step="1" value="45">
    </div>
    <div class="control-group">
        <label>Rotation Angle (RA) <span id="val-ra">45°</span></label>
        <input type="range" id="ctrl-ra" min="10" max="90" step="1" value="45">
    </div>
    <div class="control-group">
        <label>Evaporation Rate <span id="val-decay">0.99</span></label>
        <input type="range" id="ctrl-decay" min="0.8" max="0.999" step="0.001" value="0.99">
    </div>
    <button id="btn-reset" style="padding:8px; background:#6ee7b7; border:none; cursor:pointer; font-weight:bold;">Reset Particles</button>
</div>

<div id="canvas-container">
    <canvas id="sim-canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    // Low resolution for performance (grid operations are expensive in JS)
    const scale = 2; 
    let width, height;
    let grid = [], nextGrid = [];

    const params = { sa: 45 * Math.PI/180, ra: 45 * Math.PI/180, decay: 0.99, sensorDist: 9, stepSize: 1 };
    
    document.getElementById('ctrl-sa').addEventListener('input', e => { params.sa = e.target.value * Math.PI/180; document.getElementById('val-sa').textContent = e.target.value + '°'; });
    document.getElementById('ctrl-ra').addEventListener('input', e => { params.ra = e.target.value * Math.PI/180; document.getElementById('val-ra').textContent = e.target.value + '°'; });
    document.getElementById('ctrl-decay').addEventListener('input', e => { params.decay = parseFloat(e.target.value); document.getElementById('val-decay').textContent = e.target.value; });

    let particles = [];
    const numParticles = 8000;

    // `imageData` is reallocated HERE, with the grid — unlike the original, which
    // called createImageData once at top level immediately after the first
    // reset(). Two failures followed from that: a container reporting zero width
    // at first layout threw IndexSizeError, and because the throw was top-level
    // animate() never started at all; and any later resize reallocated `grid` to
    // new dimensions while the image buffer kept the old ones. Dimensions are
    // floored at 64 so a zero-width parent cannot throw in the first place.
    let imageData;

    function reset() {
        width = Math.max(64, Math.floor(canvas.parentElement.clientWidth / scale));
        height = Math.max(64, Math.floor(canvas.parentElement.clientHeight / scale));
        canvas.width = width; canvas.height = height;

        // Use 1D Float32Array for performance
        grid = new Float32Array(width * height);
        nextGrid = new Float32Array(width * height);
        imageData = ctx.createImageData(width, height);
        
        particles = [];
        const cx = width/2, cy = height/2;
        for(let i=0; i<numParticles; i++) {
            // Spawn in a circle
            const r = Math.random() * (width/4);
            const theta = Math.random() * Math.PI * 2;
            particles.push({
                x: cx + r * Math.cos(theta),
                y: cy + r * Math.sin(theta),
                angle: theta + Math.PI // Face inward
            });
        }
    }
    document.getElementById('btn-reset').addEventListener('click', reset);
    window.addEventListener('resize', reset);
    reset();

    function animate() {
        // 1. Grid Update: Diffusion & Decay (3x3 Box Blur)
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                let sum = 0;
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        let nx = x + dx, ny = y + dy;
                        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                            sum += grid[ny * width + nx];
                        }
                    }
                }
                nextGrid[y * width + x] = (sum / 9) * params.decay;
            }
        }
        
        // Swap buffers
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;

        // 2. Particle Update: Sense, Rotate, Move, Deposit
        for (let p of particles) {
            // Sense
            const getVal = (angleOffset) => {
                const a = p.angle + angleOffset;
                const sx = Math.floor(p.x + Math.cos(a) * params.sensorDist);
                const sy = Math.floor(p.y + Math.sin(a) * params.sensorDist);
                if (sx >= 0 && sx < width && sy >= 0 && sy < height) {
                    return grid[sy * width + sx];
                }
                return 0;
            };

            const wF = getVal(0);
            const wL = getVal(-params.sa);
            const wR = getVal(params.sa);

            // Motor logic
            if (wF > wL && wF > wR) {
                // Keep going
            } else if (wF < wL && wF < wR) {
                // Turn randomly left or right
                p.angle += (Math.random() > 0.5 ? params.ra : -params.ra);
            } else if (wL > wR) {
                p.angle -= params.ra;
            } else if (wR > wL) {
                p.angle += params.ra;
            }

            // Move
            p.x += Math.cos(p.angle) * params.stepSize;
            p.y += Math.sin(p.angle) * params.stepSize;

            // Constrain
            if (p.x < 0) { p.x = width-1; p.angle += Math.PI; }
            if (p.x >= width) { p.x = 0; p.angle += Math.PI; }
            if (p.y < 0) { p.y = height-1; p.angle += Math.PI; }
            if (p.y >= height) { p.y = 0; p.angle += Math.PI; }

            // Deposit
            const idx = Math.floor(p.y) * width + Math.floor(p.x);
            grid[idx] = Math.min(255, grid[idx] + 25);
        }

        // 3. Render to Canvas
        const data = imageData.data;
        for (let i = 0; i < grid.length; i++) {
            const val = grid[i];
            const px = i * 4;
            data[px] = 0;               // R
            data[px + 1] = val;         // G (Neon green)
            data[px + 2] = val * 0.5;   // B
            data[px + 3] = 255;         // Alpha
        }
        ctx.putImageData(imageData, 0, 0);

        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
