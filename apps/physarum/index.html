<head>
    <meta charset="UTF-8">

    <title>Slime-mould trails</title>
<script type="application/cogdoc+yaml">
id: paper-physarum-stigmergy
type: paper
title: "Slime-mould trails: a shared, fading trail is enough for dots to gather"
description: >
  About 8000 dots (one per 30 grid cells) each lay scent on a grid that spreads
  out and fades. Each dot sniffs three spots ahead and turns toward the strongest.
  With no other contact between dots, they gather into one or a few trail
  structures. This is the Jones (2010) Physarum model with changes, listed
  under limitations. The world wraps around at the edges (a torus).
sector: reference
status: draft
created: 2026-08-11
updated: 2026-09-24
salience: high
authors:
  - chazmaniandinkle
tags: [stigmergy, physarum, agent-coordination, decay, diffusion, eigen-form, executable-paper]
claim: >
  Depositing into a shared grid that spreads and fades is enough to make agents
  gather into trail structures, even though they never communicate directly,
  hold no model of each other, and read only three samples of the grid per step.
  Switching the fading trail off (keep-rate 0) or the turning off (turn angle 0)
  removes the structure.
method:
  - param: sa
    label: sniff angle
    range: [10, 90]
    default: 45
    unit: degrees
    meaning: how far left and right of the heading the side samples are taken
  - param: ra
    label: turn angle
    range: [10, 90]
    default: 45
    unit: degrees
    meaning: turn applied in one step when a side sample wins
  - param: decay
    label: scent kept per step
    range: [0.8, 0.999]
    default: 0.99
    meaning: >
      per-step multiplier on the grid after the blur. Higher keeps scent longer
      (it is a keep-rate, not an evaporation rate). Without other losses the
      half-life would be log(0.5)/log(decay) steps; the 255 cap on deposit
      removes more.
  - param: sensorDist
    default: 9
    fixed: true
    meaning: how far ahead the samples are taken, 9 times the step length
  - param: numParticles
    default: 8000
    fixed: true
    meaning: >
      one dot per 30 grid cells, so 8000 on the 600x400 grid of a 1500x800
      window. Density no longer depends on window size.
observables:
  agents: "round(width*height/30), 8000 at the default grid"
  field: "Float32Array(width*height); 3x3 mean filter with wrap-around, then multiply by decay"
  boundary: "periodic in both directions (torus): position, sensing and the blur all wrap"
  read_cost: "3 samples per agent per step; the blur pass is O(width*height) and dominates"
findings:
  - >
    Each dot reads three grid cells per step whatever the grid size. The blur
    over the whole grid still costs O(width*height) per step and dominates the
    run time, so a wide grid is not cheap.
  - >
    Turning rule, as coded: keep the heading only if the forward sample is
    strictly greater than both side samples; if it is strictly less than both,
    turn left or right at random; otherwise turn toward the larger side sample.
    So when forward ties the larger side sample, the dot turns toward that side.
    It keeps its heading on a tie only when all three samples are equal.
  - >
    The 255 cap truncates deposit and so caps contrast. At the defaults (600x400
    grid, 3000 steps, seeds 1-3) about 97% of the deposit each step is cut off
    by the cap, and 29-37% of dots have a capped cell straight ahead. It does not
    flatten the field under the dots: 0% of dots saw three equal samples (seeds
    1-3). An earlier version of this page said saturation "destroys
    coordination"; that was not supported and is withdrawn.
  - >
    Wrap-around boundary (v1.2): with the old "wrap and turn back" edge rule,
    8-38% of dots (uniform start, seeds 1-3, 3000 steps) and 74-75% in the
    keep-rate-0 control sat within 1 cell of an edge. With the torus it is
    0.3-0.8% and 0.6-0.8%, against 0.8% for dots spread evenly.
limitations:
  - >
    Modified Jones (2010). Implemented: sense-rotate-move-deposit, 3 samples,
    SO=9, SA=RA=45 degrees, a 3x3 mean filter with decay, periodic boundary.
    Not implemented: occupancy exclusion (one dot per cell) and depositing only
    after a successful move, which Jones names as what prevents static
    clustering; random update order. Deposit is 25 with a 255 cap, where Jones
    uses 5 with no cap. As a result many dots stack on one cell and the usual
    outcome is one contracted cluster, not the lacunar network in the paper.
  - >
    Structure is shown, not measured: the page has no clustering readout. Review
    measurements (50% of dots in about 0.2-0.3% of the area at the defaults)
    were made from outside the page.
  - >
    No robust normalisation: drawing and sensing read raw cell values against a
    hard cap. See app:welded_fields, which normalises to the 99.5th percentile.
  - >
    One simulation step per animation frame, with no time step, so wall-clock
    speed depends on the screen refresh rate. Per-step results do not.
refs:
  - uri: https://doi.org/10.1162/artl.2010.16.2.16202
    rel: implements-modified
    desc: >
      Jones, J. (2010). Characteristics of pattern formation and evolution in
      approximations of Physarum transport networks. Artificial Life 16(2),
      127-153. Source of the agent rule and parameters; see limitations for
      what differs.
  - uri: app:welded_fields
    rel: related
    desc: >
      A descendant of this page that adds metrology (normalised masks, shape
      counts). The imageData fix it annotates has since been applied here too.
  - uri: cog://rfc/058
    rel: demonstrates
    desc: >
      Declared observables' generation field as a decaying deposit medium;
      d(generation)/dt is the concentration map this simulation renders.
  - uri: cog://rfc/033
    rel: demonstrates
    desc: StigmergicProjector — coordination via trace, no messaging primitives.
  - uri: cog://mem/working/2026-08-18-physarum-as-attention-rig
    rel: grounds
    desc: Line-by-line correspondence to the attention layer derived 2026-08-18.
</script>

    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; height: 100vh; }
        #sidebar { width: 300px; background: #111; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; z-index: 10; border-right: 1px solid #333; }
        #canvas-container { flex: 1; position: relative; }
        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #6ee7b7; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; color: #ccc; display: flex; justify-content: space-between; }
        input[type=range] { width: 100%; }
        p.desc { font-size: 12px; color: #888; line-height: 1.4; margin: 0; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Slime-mould trails</h2>
    <p class="desc">Each dot leaves scent on a grid. It sniffs three spots just ahead and turns toward the strongest. The scent spreads out and fades over time. The world wraps around: a dot that leaves one edge comes back at the opposite edge.</p>
    
    <div class="control-group">
        <label title="how far left and right each dot looks">Sniff angle <span id="val-sa">45°</span></label>
        <input type="range" id="ctrl-sa" min="10" max="90" step="1" value="45">
    </div>
    <div class="control-group">
        <label title="how sharply a dot turns">Turn angle <span id="val-ra">45°</span></label>
        <input type="range" id="ctrl-ra" min="10" max="90" step="1" value="45">
    </div>
    <div class="control-group">
        <label title="Scent kept per step (0.99 = fades slowly). A keep-rate: higher means slower fading.">Scent kept per step <span id="val-decay">0.99</span></label>
        <input type="range" id="ctrl-decay" min="0.8" max="0.999" step="0.001" value="0.99">
    </div>
    <button id="btn-reset" style="padding:8px; background:#6ee7b7; border:none; cursor:pointer; font-weight:bold;">Start over</button>
</div>

<div id="canvas-container">
    <canvas id="sim-canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    // Low resolution for performance (grid operations are expensive in JS)
    const scale = 2; 
    let width, height;
    let grid = [], nextGrid = [];

    const params = { sa: 45 * Math.PI/180, ra: 45 * Math.PI/180, decay: 0.99, sensorDist: 9, stepSize: 1 };
    
    document.getElementById('ctrl-sa').addEventListener('input', e => { params.sa = e.target.value * Math.PI/180; document.getElementById('val-sa').textContent = e.target.value + '°'; });
    document.getElementById('ctrl-ra').addEventListener('input', e => { params.ra = e.target.value * Math.PI/180; document.getElementById('val-ra').textContent = e.target.value + '°'; });
    document.getElementById('ctrl-decay').addEventListener('input', e => { params.decay = parseFloat(e.target.value); document.getElementById('val-decay').textContent = e.target.value; });

    let particles = [];
    // Dot count scales with grid area so density does not depend on window size:
    // 8000 dots on the 600x400 grid of a 1500x800 window (1 dot per 30 cells).
    let numParticles = 8000;
    const cellsPerParticle = 30;

    // `imageData` is reallocated HERE, with the grid — unlike the original, which
    // called createImageData once at top level immediately after the first
    // reset(). Two failures followed from that: a container reporting zero width
    // at first layout threw IndexSizeError, and because the throw was top-level
    // animate() never started at all; and any later resize reallocated `grid` to
    // new dimensions while the image buffer kept the old ones. Dimensions are
    // floored at 64 so a zero-width parent cannot throw in the first place.
    let imageData;
    // Spawn-disk radius: min(width, height)/4, so the disk always fits inside the grid
    // (width/4 used to overflow vertically on wide windows).
    const SPAWN_R = (w, h) => Math.min(w, h) / 4;

    function reset() {
        width = Math.max(64, Math.floor(canvas.parentElement.clientWidth / scale));
        height = Math.max(64, Math.floor(canvas.parentElement.clientHeight / scale));
        canvas.width = width; canvas.height = height;

        // Use 1D Float32Array for performance
        grid = new Float32Array(width * height);
        nextGrid = new Float32Array(width * height);
        imageData = ctx.createImageData(width, height);
        
        numParticles = Math.max(500, Math.round(width * height / cellsPerParticle));
        particles = [];
        const cx = width/2, cy = height/2;
        const spawnR = SPAWN_R(width, height);
        for(let i=0; i<numParticles; i++) {
            // Spawn in a circle that fits inside the grid
            const r = Math.random() * spawnR;
            const theta = Math.random() * Math.PI * 2;
            particles.push({
                x: cx + r * Math.cos(theta),
                y: cy + r * Math.sin(theta),
                angle: theta + Math.PI // Face inward
            });
        }
    }
    document.getElementById('btn-reset').addEventListener('click', reset);
    window.addEventListener('resize', reset);
    reset();

    function animate() {
        // 1. Grid Update: Diffusion & Decay (3x3 Box Blur)
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                let sum = 0;
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        // Periodic (torus): neighbours across an edge come from the opposite edge.
                        const nx = (x + dx + width) % width, ny = (y + dy + height) % height;
                        sum += grid[ny * width + nx];
                    }
                }
                nextGrid[y * width + x] = (sum / 9) * params.decay;
            }
        }
        
        // Swap buffers
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;

        // 2. Particle Update: Sense, Rotate, Move, Deposit
        for (let p of particles) {
            // Sense
            const getVal = (angleOffset) => {
                const a = p.angle + angleOffset;
                // Periodic sensing: a sensor that reaches past an edge reads the opposite edge.
                let sx = Math.floor(p.x + Math.cos(a) * params.sensorDist) % width;
                let sy = Math.floor(p.y + Math.sin(a) * params.sensorDist) % height;
                if (sx < 0) sx += width;
                if (sy < 0) sy += height;
                return grid[sy * width + sx];
            };

            const wF = getVal(0);
            const wL = getVal(-params.sa);
            const wR = getVal(params.sa);

            // Motor logic
            if (wF > wL && wF > wR) {
                // Keep going
            } else if (wF < wL && wF < wR) {
                // Turn randomly left or right
                p.angle += (Math.random() > 0.5 ? params.ra : -params.ra);
            } else if (wL > wR) {
                p.angle -= params.ra;
            } else if (wR > wL) {
                p.angle += params.ra;
            }

            // Move
            p.x += Math.cos(p.angle) * params.stepSize;
            p.y += Math.sin(p.angle) * params.stepSize;

            // Periodic boundary (torus): leave one edge, re-enter at the opposite edge with
            // the same heading. (Before v1.2 the heading was also turned by pi, which sent the
            // dot straight back across the edge and trapped it there.)
            if (p.x < 0) p.x += width;
            if (p.x >= width) p.x -= width;
            if (p.y < 0) p.y += height;
            if (p.y >= height) p.y -= height;

            // Deposit
            const idx = Math.floor(p.y) * width + Math.floor(p.x);
            grid[idx] = Math.min(255, grid[idx] + 25);
        }

        // 3. Render to Canvas
        const data = imageData.data;
        for (let i = 0; i < grid.length; i++) {
            const val = grid[i];
            const px = i * 4;
            data[px] = 0;               // R
            data[px + 1] = val;         // G (Neon green)
            data[px + 2] = val * 0.5;   // B
            data[px + 3] = 255;         // Alpha
        }
        ctx.putImageData(imageData, 0, 0);

        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
