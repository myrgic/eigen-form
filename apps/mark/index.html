<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Mark: eigen-form lab</title>
<!-- The SDK's canonical tokens + panel stylesheet (docs/params-panel-design.md,
     "One visual language" / "module principles"): this page no longer keeps
     its own hand-derived palette. Theme flows in entirely through the custom
     properties these two files declare; #panel below carries no rules of its
     own beyond what a display module's *container* is allowed to own
     (position, sizing bounds) — never color, font, or spacing. -->
<link rel="stylesheet" href="../../src/panel/tokens.css">
<link rel="stylesheet" href="../../src/panel/panel.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 32px;
    padding: 32px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
  }
  .stage-col {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; min-height: 80vh;
  }
  .stage {
    width: min(70vmin, 600px);
    aspect-ratio: 1;
    border: 1px solid var(--line);
    border-radius: var(--radius-3);
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .meta { text-align: center; }
  .meta .title { font-size: 20px; letter-spacing: 0.04em; }
  .meta .tagline { margin-top: 6px; font-size: 12px; color: var(--faint); }

  /* #panel is the container renderPanel(store, container) is given —
     this is the whole of what the page is allowed to own about it:
     where it sits (sticky column) and how tall it may grow. Color,
     padding, layout-of-contents all belong to .ef-panel in panel.css,
     applied to this same element by renderPanel itself. */
  #panel {
    border: 1px solid var(--line);
    border-radius: var(--radius-3);
    position: sticky;
    top: 24px;
    max-height: calc(100vh - 48px);
  }

  /* The one control below the generated panel that isn't a declared
     parameter: emergence only plays out at construction time (there's
     no live setParam for it), so it stays a page-level action rather
     than a schema knob. Styled to match the panel's own control family
     off the same tokens. */
  #panel hr.ef-div { border: 0; border-top: 1px solid var(--line); margin: var(--space-2) 0; }
  #panel button.ef-action {
    width: 100%;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius-1);
    padding: var(--space-2) var(--space-3);
    font: 10.5px var(--mono);
    color: var(--dim);
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: border-color 120ms, color 120ms;
  }
  #panel button.ef-action:hover { color: var(--fg); border-color: var(--accent); }
</style>
</head>
<body>
  <div class="stage-col">
    <div class="stage"><canvas id="mark" width="1080" height="1080"></canvas></div>
    <div class="meta">
      <div class="title">The Mark</div>
      <div class="tagline">(2,3) torus knot, traced live against a fading substrate</div>
    </div>
  </div>

  <!-- Generated control surface: docs/params-panel-design.md. This div is
       the whole of the panel's markup now — renderPanel(store, this)
       builds every group/knob into it from the schema declared below;
       nothing here is hand-bound. -->
  <div class="panel" id="panel"></div>

<script type="module">
// This page imports the library directly (docs/lab-design.md, "Consuming
// the library") and calls createTrefoilMark imperatively to hold the
// returned controller, so the generated panel below can drive it via
// store.subscribe -> controller.setParam. The canvas intentionally does
// NOT carry data-myrgic-mark: the library's own mount.autoInit() scans
// for that attribute on module load and would construct a second,
// uncontrolled mark instance on the same canvas alongside this one.
import { createTrefoilMark } from '../../src/eigen-form.js';
import { defineParams } from '../../src/params/define.js';
import { renderPanel } from '../../src/panel/render.js';

// The mark's declared parameter schema (docs/params-panel-design.md,
// "defineParams"). Ranges mined from examples/configurator.html (the
// hand-tuned UI bounds this page used to hard-code) and docs/parameters.md
// (the library's own documented range per parameter); scale: 'log' on
// period and decay because both span roughly two orders of magnitude,
// where a linear slider wastes most of its travel on the low end.
const schema = {
  p:           { type: 'number', min: 1,      max: 7,      step: 1,   default: 2,    group: 'eigenmode',  label: 'p (angular)' },
  q:           { type: 'number', min: 1,      max: 7,      step: 1,   default: 3,    group: 'eigenmode',  label: 'q (radial)' },
  scale:       { type: 'number', min: 100,    max: 350,    step: 1,   unit: 'px',    default: 215,  group: 'orbit',      label: 'scale' },
  period:      { type: 'number', min: 500,    max: 30000,  step: 100, unit: 'ms',    default: 3000, group: 'orbit',      label: 'period', scale: 'log' },
  ballRadius:  { type: 'number', min: 2,      max: 60,     step: 1,   unit: 'px',    default: 18,   group: 'path',       label: 'ball radius' },
  strokeWidth: { type: 'number', min: 1,      max: 100,    step: 1,   unit: 'px',    default: 36,   group: 'path',       label: 'thickness' },
  decay:       { type: 'number', min: 500,    max: 60000,  step: 100, unit: 'ms',    default: 6000, group: 'path',       label: 'memory', scale: 'log' },
  precession:  { type: 'number', min: -100000, max: 100000, step: 500, unit: 'ms',   default: 0,    group: 'precession', label: 'period' },
  parallax:    { type: 'number', min: -2,     max: 4,      step: 0.1, default: 0,    group: 'hue parallax', label: 'detune' },
  gradient:    { type: 'select', options: ['spectrum', 'cogos', 'mod3', 'research', 'constellation', 'duotone', 'mono', 'madder'],
                 default: 'spectrum', group: 'hue', label: 'gradient' }
};

const store = defineParams(schema);

const canvas = document.getElementById('mark');
// store.values() keys line up 1:1 with createTrefoilMark's opts (p, q,
// scale, period, ballRadius, strokeWidth, decay, precession, parallax,
// gradient) — the schema was declared to match the controller's own
// parameter names, so no translation layer sits between the two.
let mark = createTrefoilMark(canvas, { emergence: false, ...store.values() });

// The whole wiring the design doc promises: every store change reaches
// the controller through one subscription, no per-slider handlers.
store.subscribe((key, value) => {
  if (mark && mark.setParam) mark.setParam(key, value);
});

function rebuild(opts) {
  // Stop existing & recreate to apply emergence reset cleanly.
  if (mark && mark.stop) mark.stop();
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  mark = createTrefoilMark(canvas, opts);
}

const panelEl = document.getElementById('panel');
renderPanel(store, panelEl);

// Replay: full rebuild with emergence, from the store's current values.
// Not a schema knob (emergence only applies at construction, there's no
// live setParam for it), so it's appended after the generated groups
// rather than declared in the schema.
const hr = document.createElement('hr');
hr.className = 'ef-div';
const replayBtn = document.createElement('button');
replayBtn.type = 'button';
replayBtn.className = 'ef-action';
replayBtn.textContent = '↻ replay emergence';
replayBtn.addEventListener('click', () => {
  rebuild({ ...store.values(), emergence: true });
});
panelEl.appendChild(hr);
panelEl.appendChild(replayBtn);
</script>
</body>
</html>
