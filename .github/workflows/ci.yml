name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Tests + goldens + lab registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm run check
        run: npm run check

  public-release-gate:
    uses: myrgic/.github/.github/workflows/public-release-gate.yml@main
